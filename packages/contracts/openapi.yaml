        retrieval_config_version:
          type: string
        generation_config:
          type: object
          additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
        completed_at:
          type: string
          format: date-time
      additionalProperties: true
    EvalReport:
      allOf:
        - $ref: "#/components/schemas/EvalReportRegistration"
        - type: object
          required: [report_payload, created_at]
          properties:
            report_payload:
              type: object
              additionalProperties: true
            created_at:
              type: string
              format: date-time
    EvalReportEnvelope:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/EvalReport"
      additionalProperties: false
    EvalReportListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvalReport"
        next_cursor:
          type: string
      additionalProperties: false
    RetrievalLogEntry:
      type: object
      required: [request_id, conversation_id, message_id, created_at]
      properties:
        request_id:
          type: string
        conversation_id:
          type: string
        message_id:
          type: string
        created_at:
          type: string
          format: date-time
        top_k:
          type: integer
          minimum: 1
      additionalProperties: false
    MessageExecutionEvidence:
      type: object
      required: [message_id, conversation_id, request_id, config_version, retrieval_config_version, model_id, generation_config, retrieval_config, refusal, finish_reason, completed_at, intent, retrieval_performed, generation_performed, knowledge_used]
      properties:
        message_id:
          type: string
        conversation_id:
          type: string
        request_id:
          type: string
        config_version:
          type: string
        retrieval_config_version:
          type: string
        knowledge_snapshot_id:
          type: string
        model_id:
          type: string
        generation_config:
          type: object
          additionalProperties: true
        retrieval_config:
          type: object
          additionalProperties: true
        usage:
          type: object
          additionalProperties: true
        refusal:
          type: boolean
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        completed_at:
          type: string
          format: date-time
        intent:
          type: string
          enum: [knowledge_query, social_greeting, social_thanks, social_farewell, capability_help, off_topic, out_of_scope]
        retrieval_performed:
          type: boolean
        generation_performed:
          type: boolean
        knowledge_used:
          type: boolean
        answer_disposition:
          $ref: "#/components/schemas/AnswerDisposition"
        answer_policy_version:
          type: string
          enum: [answer_policy_v1, answer_policy_v2, answer_policy_v3, answer_policy_v4, answer_policy_v5]
        policy_evaluation_performed:
          type: boolean
        answer_generation_performed:
          type: boolean
        clarification:
          $ref: "#/components/schemas/AnswerClarification"
        coverage:
          $ref: "#/components/schemas/AnswerCoverage"
        resolution:
          $ref: "#/components/schemas/ClarificationResolution"
        resolved_query:
          type: string
        execution:
          $ref: "#/components/schemas/ExecutionObservation"
        retrieval_candidates:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalCandidate"
        used_citation_ranks:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        context_resolution:
          $ref: "#/components/schemas/ContextResolution"
      allOf:
        - if:
            required: [answer_policy_version, answer_disposition]
            properties:
              answer_policy_version:
                enum: [answer_policy_v1, answer_policy_v2, answer_policy_v3, answer_policy_v4, answer_policy_v5]
              answer_disposition:
                not:
                  const: controlled_response
          then:
            required: [execution]
            properties:
              execution:
                allOf:
                  - $ref: "#/components/schemas/ExecutionObservation"
                  - required: [policy, policy_provider, policy_model_id, policy_call_count]
                    properties:
                      policy:
                        const: performed
        - if:
            required: [answer_disposition]
            properties:
              answer_disposition:
                const: controlled_response
          then:
            properties:
              execution:
                allOf:
                  - $ref: "#/components/schemas/ExecutionObservation"
                  - required: [policy]
                    properties:
                      policy:
                        const: not_run
                  - not:
                      anyOf:
                        - required: [policy_provider]
                        - required: [policy_model_id]
                        - required: [policy_call_count]
      additionalProperties: false
    ExecutionObservation:
      type: object
      required: [policy, retrieval, generation, fallback_used]
      properties:
        policy:
          type: string
          enum: [performed, not_run]
        policy_provider:
          type: string
          minLength: 1
        policy_model_id:
          type: string
          minLength: 1
        policy_call_count:
          type: integer
          minimum: 1
        scope_shape:
          type: string
          enum: [fact_lookup, branch_dependent, unknown_target]
        retrieval_target:
          type: string
          minLength: 1
          maxLength: 1200
        requested_fact_fields:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        unresolved_branch_dimensions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        untrusted_instruction_present:
          type: boolean
        retrieval:
          $ref: "#/components/schemas/RetrievalExecutionObservation"
        generation:
          $ref: "#/components/schemas/GenerationExecutionObservation"
        fallback_used:
          type: boolean
      additionalProperties: false
    RetrievalExecutionObservation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [performed, not_run]
        strategy:
          type: string
        embedding_model:
          type: string
        collection:
          type: string
        candidate_count:
          type: integer
          minimum: 0
        top_k:
          type: integer
          minimum: 1
        rerank_enabled:
          type: boolean
        evidence_min_score:
          type: number
          exclusiveMinimum: 0
          maximum: 1
      allOf:
        - if:
            properties:
              status:
                const: performed
            required: [status]
          then:
            required: [strategy, embedding_model, collection, candidate_count, top_k, rerank_enabled, evidence_min_score]
      additionalProperties: false
    GenerationExecutionObservation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [performed, not_run]
        provider:
          type: string
        model_id:
          type: string
      additionalProperties: false
    ContextResolution:
      type: object
      required: [intent, route, kind, basis_message_ids, resolver_performed, confidence]
      properties:
        intent:
          type: string
          enum: [knowledge_query, social_greeting, social_thanks, social_farewell, capability_help, off_topic, out_of_scope]
        route:
          type: string
          enum: [rag, controlled_reply, clarification]
        kind:
          type: string
          enum: [follow_up, standalone, topic_shift, clarification_required]
        resolved_query:
          type: string
        basis_message_ids:
          type: array
          items: {type: string}
        router_policy_version:
          type: string
          enum: [conversation_router_v1]
        resolver_provider:
          type: string
        resolver_model_id:
          type: string
        resolver_performed:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
    MessageExecutionEvidenceEnvelope:
      type: object
      required: [evidence]
      properties:
        evidence:
          $ref: "#/components/schemas/MessageExecutionEvidence"
      additionalProperties: false
    MessageExecutionEvidenceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageExecutionEvidence"
        next_cursor:
          type: string
      additionalProperties: false
    KnowledgeDeliveryEvidence:
      type: object
      required: [delivery_id, topic, status, attempt_count, available_at, created_at, updated_at]
      properties:
        delivery_id:
