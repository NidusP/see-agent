        conversation_id:
          type: string
        message_id:
          type: string
        model_id:
          type: string
        created_at:
          type: string
          format: date-time
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
      additionalProperties: false
    GenerationLogListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GenerationLogEntry"
        total:
