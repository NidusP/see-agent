          format: date-time
        stream_message_id:
          type: string
        lease_until:
          type: string
          format: date-time
        last_error:
          type: string
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    KnowledgeDeliveryEvidenceListResponse:
