    AgentConfig:
      type: object
      required:
        - config_version
        - model_id
        - system_prompt_version
        - response_style
        - temperature
        - top_p
        - max_output_tokens
        - answer_policy_version
        - created_at
      properties:
        config_version:
          type: string
        model_id:
          type: string
        system_prompt_version:
          type: string
          enum: [prompt_v1, prompt_v2, prompt_v3, prompt_v4, prompt_v5, prompt_v6, prompt_v7, prompt_v8, prompt_v9, prompt_v10, prompt_v11, prompt_v12]
        response_style:
          type: string
        temperature:
          type: number
        top_p:
          type: number
          minimum: 0
          maximum: 1
        max_output_tokens:
          type: integer
          minimum: 1
        answer_policy_version:
          type: string
          enum: [legacy_unknown, answer_policy_v1, answer_policy_v2, answer_policy_v3, answer_policy_v4, answer_policy_v5]
        created_at:
          type: string
          format: date-time
      additionalProperties: false
      allOf:
        - if:
            properties:
              system_prompt_version:
                enum: [prompt_v1, prompt_v2, prompt_v3, prompt_v4, prompt_v5, prompt_v6, prompt_v7]
          then:
            properties:
              answer_policy_version:
                const: legacy_unknown
        - if:
            properties:
              system_prompt_version:
                const: prompt_v8
          then:
            properties:
              answer_policy_version:
                const: answer_policy_v1
        - if:
            properties:
              system_prompt_version:
                const: prompt_v9
          then:
            properties:
              answer_policy_version:
                const: answer_policy_v2
        - if:
            properties:
              system_prompt_version:
                const: prompt_v10
          then:
            properties:
              answer_policy_version:
                const: answer_policy_v3
        - if:
            properties:
              system_prompt_version:
                const: prompt_v11
          then:
            properties:
              answer_policy_version:
                const: answer_policy_v4
        - if:
            properties:
              system_prompt_version:
                const: prompt_v12
          then:
            properties:
              answer_policy_version:
                const: answer_policy_v5
    UpdateAgentConfigRequest:
      type: object
      required: [model_id, system_prompt_version, temperature, max_output_tokens]
      properties:
        model_id:
          type: string
        system_prompt_version:
          type: string
          enum: [prompt_v1, prompt_v2, prompt_v3, prompt_v4, prompt_v5, prompt_v6, prompt_v7, prompt_v8, prompt_v9, prompt_v10, prompt_v11, prompt_v12]
        response_style:
          type: string
          default: concise
        temperature:
          type: number
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        max_output_tokens:
          type: integer
          minimum: 1
        answer_policy_version:
          type: string
          enum: [answer_policy_v1, answer_policy_v2, answer_policy_v3, answer_policy_v4, answer_policy_v5]
      additionalProperties: false
      allOf:
        - if:
            properties:
              system_prompt_version:
                enum: [prompt_v1, prompt_v2, prompt_v3, prompt_v4, prompt_v5, prompt_v6, prompt_v7]
          then:
            not:
              required: [answer_policy_version]
        - if:
            properties:
              system_prompt_version:
                const: prompt_v8
          then:
            required: [answer_policy_version]
            properties:
              answer_policy_version:
                const: answer_policy_v1
        - if:
            properties:
              system_prompt_version:
                const: prompt_v9
          then:
            required: [answer_policy_version]
            properties:
              answer_policy_version:
                const: answer_policy_v2
        - if:
            properties:
              system_prompt_version:
                const: prompt_v10
          then:
            required: [answer_policy_version]
            properties:
              answer_policy_version:
                const: answer_policy_v3
        - if:
            properties:
              system_prompt_version:
                const: prompt_v11
          then:
            required: [answer_policy_version]
            properties:
              answer_policy_version:
                const: answer_policy_v4
        - if:
            properties:
              system_prompt_version:
                const: prompt_v12
          then:
            required: [answer_policy_version]
            properties:
              answer_policy_version:
                const: answer_policy_v5
