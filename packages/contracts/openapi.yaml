openapi: 3.1.0
info:
  title: see-agent API
  version: 0.4.0-f0
  description: >
    Single-agent V1 external product API contract for the private web Q&A product.
    F0 freezes fail-closed execution: completed messages are real completed dispositions,
    while dependency and contract failures use a stable error envelope and never imply citations.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: chat
  - name: knowledge-base
  - name: agent-config
  - name: eval
  - name: logs
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login for internal single-tenant users
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout the current user
      operationId: logout
      responses:
        "200":
          description: Logout succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated internal user and role
      operationId: getAuthenticatedUser
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/chat/conversations:
    get:
      tags: [chat]
      summary: List conversations
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextCursor"
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
    post:
      tags: [chat]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/chat/conversations/{conversation_id}:
    get:
      tags: [chat]
      summary: Get a conversation by id
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [chat]
      summary: Rename a conversation owned by the current user
      operationId: updateConversationTitle
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationTitleRequest"
      responses:
        "200":
          description: Conversation renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/chat/conversations/{conversation_id}/messages:
    post:
      tags: [chat]
      summary: Send a user message and request an assistant answer
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "200":
          description: Non-streaming answer response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageExchangeResponse"
            text/event-stream:
              schema:
                type: string
              examples:
                assistant-stream:
                  value: |
                    event: message.started
                    data: {"user_message":{"message_id":"msg_user_123","role":"user","content":"hello","status":"completed"},"assistant_message":{"message_id":"msg_123","role":"assistant","content":"","status":"streaming"}}

                    event: message.delta
                    data: {"message_id":"msg_123","delta":"hello"}

                    event: message.completed
                    data: {"user_message":{"message_id":"msg_user_123","role":"user","content":"hello","status":"completed"},"assistant_message":{"message_id":"msg_123","role":"assistant","content":"hello","status":"completed","finish_reason":"stop","citations_count":1}}

                    # terminal failure example; mutually exclusive with message.completed
                    event: message.error
                    data: {"error":{"code":"dependency_unavailable","message":"当前无法安全完成回答，请稍后重试。","retryable":true,"request_id":"req_123","stage":"runtime_call"}}
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/RuntimeContractError"
        "503":
          $ref: "#/components/responses/DependencyUnavailableError"
  /api/chat/conversations/{conversation_id}/sources/{message_id}:
    get:
      tags: [chat]
      summary: Get source references for an assistant message
      operationId: getMessageSources
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSourcesResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/chat/conversations/{conversation_id}/messages/{message_id}/revalidate:
    post:
      tags: [chat]
      summary: Revalidate a historical assistant answer against the latest published knowledge snapshot
      operationId: revalidateMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevalidateMessageRequest"
      responses:
        "202":
          description: Revalidation accepted; the historical answer is never modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevalidationRunEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/chat/conversations/{conversation_id}/revalidations/{revalidation_id}:
    get:
      tags: [chat]
      summary: Get a historical answer revalidation result
      operationId: getRevalidation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: revalidation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revalidation status and, once complete, its independent answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevalidationRunEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/kb/files:
    get:
      tags: [knowledge-base]
      summary: List knowledge files
      operationId: listKnowledgeFiles
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextCursor"
        - $ref: "#/components/parameters/FileStatus"
        - $ref: "#/components/parameters/SourceFormat"
      responses:
        "200":
          description: Knowledge file list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileListResponse"
    post:
      tags: [knowledge-base]
      summary: Upload a knowledge file and create an ingestion task
      operationId: uploadKnowledgeFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadKnowledgeFileRequest"
      responses:
        "202":
          description: Upload accepted and ingestion queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadKnowledgeFileResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/kb/files/{file_id}:
    get:
      tags: [knowledge-base]
      summary: Get a knowledge file by id
      operationId: getKnowledgeFile
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Knowledge file detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [knowledge-base]
      summary: Delete a knowledge file and its indexed artifacts
      operationId: deleteKnowledgeFile
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File deletion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteKnowledgeFileResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/kb/files/{file_id}/reindex:
    post:
      tags: [knowledge-base]
      summary: Reindex a knowledge file
      operationId: reindexKnowledgeFile
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexKnowledgeFileRequest"
      responses:
        "202":
          description: Reindex task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionTaskEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/kb/files/{file_id}/chunks:
    get:
      tags: [knowledge-base]
      summary: Inspect indexed chunks for a file
      operationId: listKnowledgeFileChunks
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Chunk list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileChunksResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/kb/documents:
    get:
      tags: [knowledge-base]
      summary: List logical knowledge documents and their current revision summaries (K4)
      operationId: listKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextCursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/KnowledgeDocumentStatus"
      responses:
        "200":
          description: Logical document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentListResponse"
    post:
      tags: [knowledge-base]
      summary: Upload initial immutable revision and create a logical document (K4)
      operationId: createKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadKnowledgeDocumentRequest"
      responses:
        "202":
          description: Document created and initial revision queued for K3 projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRevisionUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/kb/documents/{document_id}:
    get:
      tags: [knowledge-base]
      summary: Get a logical document, its immutable revisions and delivery summaries (K4)
      operationId: getKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Logical document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [knowledge-base]
      summary: System-admin soft-delete of a disabled document after the new-only snapshot passes onboarding (K9-R2)
      operationId: deleteKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Document soft-deleted; historical evidence is retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeLifecycleMutationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/kb/documents/{document_id}/retirement-readiness:
    get:
      tags: [knowledge-base]
      summary: Get the current-snapshot onboarding proof required for system-admin retirement (K9-R2)
      operationId: getKnowledgeRetirementReadiness
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Current retirement readiness and blockers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRetirementReadinessResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/kb/documents/{document_id}/revisions:
    post:
      tags: [knowledge-base]
      summary: Upload a replacement immutable revision for an active document (K4)
      operationId: createKnowledgeRevision
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadKnowledgeRevisionRequest"
      responses:
        "202":
          description: Replacement revision queued for K3 projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRevisionUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/kb/revisions/{revision_id}/publish:
    post:
      tags: [knowledge-base]
      summary: Publish a ready revision as the next active snapshot (K4)
      operationId: publishKnowledgeRevision
      parameters:
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revision published in a new active snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeLifecycleMutationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/kb/documents/{document_id}/disable:
    post:
      tags: [knowledge-base]
      summary: System-admin disable after a replacement-inclusive snapshot passes onboarding (K9-R2)
      operationId: disableKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Document removed from future visible knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeLifecycleMutationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /api/kb/updates:
    get:
      tags: [knowledge-base]
      summary: List immutable knowledge update events and freshness scan progress
      operationId: listKnowledgeUpdates
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextCursor"
        - $ref: "#/components/parameters/DocumentIdQuery"
      responses:
        "200":
          description: Knowledge update calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUpdateListResponse"
  /api/kb/snapshots/{snapshot_id}:
    get:
      tags: [knowledge-base]
      summary: Get an immutable knowledge snapshot manifest
      operationId: getKnowledgeSnapshot
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: Knowledge snapshot with immutable members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSnapshotDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/agent/config:
    get:
      tags: [agent-config]
      summary: Get the active agent config
      operationId: getAgentConfig
      responses:
        "200":
          description: Active agent config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigEnvelope"
    put:
      tags: [agent-config]
      summary: Create an immutable agent config candidate
      description: Creates an immutable candidate without changing the active config pointer; a separate publish operation activates a candidate.
      operationId: updateAgentConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentConfigRequest"
      responses:
        "200":
          description: Immutable agent config candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/agent/retrieval-config:
    get:
      tags: [agent-config]
      summary: Get the active retrieval config
      operationId: getRetrievalConfig
      responses:
        "200":
          description: Active retrieval config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalConfigEnvelope"
    put:
      tags: [agent-config]
      summary: Create a new retrieval config version
      operationId: updateRetrievalConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRetrievalConfigRequest"
      responses:
        "200":
          description: New retrieval config version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalConfigEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/agent/config/versions:
    get:
      tags: [agent-config]
      summary: List Agent and retrieval config versions
      operationId: listConfigVersions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextCursor"
      responses:
        "200":
          description: Config history lists in creation order; each kind is compared within its own list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersionListResponse"
  /api/admin/evidence/executions:
    get:
      tags: [logs]
      summary: List durable assistant execution evidence for administrators
      operationId: listExecutionEvidence
      parameters:
        - $ref: "#/components/parameters/ConversationIdQuery"
        - name: snapshot_id
          in: query
          required: false
          schema:
            type: string
        - name: revision_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Durable execution evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageExecutionEvidenceListResponse"
  /api/admin/evidence/messages/{message_id}:
    get:
      tags: [logs]
      summary: Get durable execution evidence for one assistant message
      operationId: getMessageExecutionEvidence
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Execution evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageExecutionEvidenceEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/admin/evidence/deliveries:
    get:
      tags: [logs]
      summary: List authoritative knowledge outbox delivery evidence
      operationId: listKnowledgeDeliveryEvidence
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, streamed, indexing, retry, delivered, dead_letter]
        - $ref: "#/components/parameters/DocumentIdQuery"
        - name: revision_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Delivery evidence page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDeliveryEvidenceListResponse"
  /api/eval/reports:
    get:
      tags: [eval]
      summary: List registered eval reports
      operationId: listEvalReports
      parameters:
        - name: config_version
          in: query
          required: false
          schema:
            type: string
        - name: retrieval_config_version
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Eval report page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalReportListResponse"
    post:
      tags: [eval]
      summary: Idempotently register a completed eval report
      operationId: registerEvalReport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalReportRegistration"
      responses:
        "201":
          description: Eval report registered or the equivalent prior registration returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalReportEnvelope"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/eval/reports/{report_id}:
    get:
      tags: [eval]
      summary: Get a registered eval report
      operationId: getEvalReport
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Eval report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalReportEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/admin/quality/feedback:
    get:
      tags: [quality-operations]
      summary: List immutable administrator answer feedback
      operationId: listQualityFeedback
      parameters:
        - name: message_id
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema: {$ref: "#/components/schemas/AnswerFeedbackKind"}
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Feedback page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnswerFeedbackListResponse"}
    post:
      tags: [quality-operations]
      summary: Append feedback for an evidenced assistant answer
      operationId: createQualityFeedback
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAnswerFeedbackRequest"}
      responses:
        "201":
          description: Feedback created or equivalent prior write returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnswerFeedbackEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/admin/quality/experiments:
    get:
      tags: [quality-operations]
      summary: List governed quality experiments
      operationId: listQualityExperiments
      parameters:
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/QualityExperimentStatus"}
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Experiment page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentListResponse"}
    post:
      tags: [quality-operations]
      summary: Create a draft experiment with candidate configs isolated from production
      operationId: createQualityExperiment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateQualityExperimentRequest"}
      responses:
        "201":
          description: Draft experiment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/admin/quality/experiments/{experiment_id}:
    get:
      tags: [quality-operations]
      summary: Get a governed quality experiment
      operationId: getQualityExperiment
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentEnvelope"}
        "404": {$ref: "#/components/responses/NotFoundError"}
  /api/admin/quality/experiments/{experiment_id}/feedback:
    post:
      tags: [quality-operations]
      summary: Attach reviewed feedback while an experiment is unfrozen
      operationId: attachQualityExperimentFeedback
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AttachQualityExperimentFeedbackRequest"}
      responses:
        "200":
          description: Updated experiment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/admin/quality/experiments/{experiment_id}/freeze:
    post:
      tags: [quality-operations]
      summary: Freeze conditions and make an experiment ready for controlled evaluation
      operationId: freezeQualityExperiment
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Frozen experiment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
  /api/admin/quality/experiments/{experiment_id}/reports:
    post:
      tags: [quality-operations]
      summary: Register an exact-match controlled runner report for an evaluating experiment
      operationId: registerQualityExperimentReport
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterQualityExperimentReportRequest"}
      responses:
        "200":
          description: Experiment ready for review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/admin/quality/experiments/{experiment_id}/approve:
    post:
      tags: [quality-operations]
      summary: Approve a gate-passing experiment for publication
      operationId: approveQualityExperiment
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QualityDecisionRequest"}
      responses:
        "200":
          description: Approved experiment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityExperimentEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
  /api/admin/quality/experiments/{experiment_id}/publish:
    post:
      tags: [quality-operations]
      summary: Atomically publish an approved config pair for future conversations
      operationId: publishQualityExperiment
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Published release
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityReleaseEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
  /api/admin/quality/releases:
    get:
      tags: [quality-operations]
      summary: List immutable quality releases
      operationId: listQualityReleases
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Release page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityReleaseListResponse"}
  /api/admin/quality/releases/{release_id}/rollback:
    post:
      tags: [quality-operations]
      summary: Create a forward rollback release for a prior published config pair
      operationId: rollbackQualityRelease
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: New rollback release
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QualityReleaseEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
  /api/admin/onboarding/datasets:
    get:
      tags: [onboarding-quality]
      summary: List administrator onboarding datasets
      operationId: listOnboardingDatasets
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Onboarding dataset page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingDatasetListResponse"}
    post:
      tags: [onboarding-quality]
      summary: Create a draft onboarding dataset for an already published snapshot
      operationId: createOnboardingDataset
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateOnboardingDatasetRequest"}
      responses:
        "201":
          description: Draft dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingDatasetEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/admin/onboarding/datasets/{dataset_id}:
    get:
      tags: [onboarding-quality]
      summary: Get an onboarding dataset with reviewed cases
      operationId: getOnboardingDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Onboarding dataset detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingDatasetEnvelope"}
        "404": {$ref: "#/components/responses/NotFoundError"}
  /api/admin/onboarding/datasets/{dataset_id}/cases:
    post:
      tags: [onboarding-quality]
      summary: Add a draft or reviewed truth case to a draft onboarding dataset
      operationId: createOnboardingCase
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateOnboardingCaseRequest"}
      responses:
        "201":
          description: Onboarding case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingCaseEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/admin/onboarding/datasets/{dataset_id}/freeze:
    post:
      tags: [onboarding-quality]
      summary: Freeze reviewed onboarding truth and its canonical hash
      operationId: freezeOnboardingDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Frozen dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingDatasetEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
  /api/admin/onboarding/datasets/{dataset_id}/runs:
    post:
      tags: [onboarding-quality]
      summary: Queue a snapshot-scoped onboarding evaluation run
      operationId: createOnboardingRun
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Queued run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingRunEnvelope"}
        "409": {$ref: "#/components/responses/ConflictError"}
  /api/admin/onboarding/runs/{run_id}:
    get:
      tags: [onboarding-quality]
      summary: Get a persisted onboarding evaluation run and its case results
      operationId: getOnboardingRun
      parameters:
        - $ref: "#/components/parameters/OnboardingRunId"
      responses:
        "200":
          description: Onboarding run detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingRunEnvelope"}
        "404": {$ref: "#/components/responses/NotFoundError"}
  /api/logs/retrieval:
    get:
      tags: [logs]
      summary: List retrieval logs
      operationId: listRetrievalLogs
      parameters:
        - $ref: "#/components/parameters/ConversationIdQuery"
        - $ref: "#/components/parameters/MessageIdQuery"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Retrieval logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalLogListResponse"
  /api/logs/generation:
    get:
      tags: [logs]
      summary: List generation logs
      operationId: listGenerationLogs
      parameters:
        - $ref: "#/components/parameters/ConversationIdQuery"
        - $ref: "#/components/parameters/MessageIdQuery"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Generation logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationLogListResponse"
components:
  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    DocumentIdQuery:
      name: document_id
      in: query
      required: false
      schema:
        type: string
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
    OnboardingRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    NextCursor:
      name: next_cursor
      in: query
      required: false
      schema:
        type: string
    FileStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FileStatus"
    SourceFormat:
      name: source_format
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SourceFormat"
    ConversationIdQuery:
      name: conversation_id
      in: query
      required: false
      schema:
        type: string
    MessageIdQuery:
      name: message_id
      in: query
      required: false
      schema:
        type: string
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RuntimeContractError:
      description: Runtime returned an unverifiable result. No completed assistant message or citation is persisted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyUnavailableError:
      description: A required product dependency is unavailable. The client must not render an empty success state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SourceFormat:
      type: string
      enum: [txt, md, json, pdf, docx, xlsx, pptx]
    FileStatus:
      type: string
      enum: [uploaded, queued, running, succeeded, failed, deleted]
    MessageRole:
      type: string
      enum: [system, user, assistant]
    MessageStatus:
      type: string
      enum: [pending, streaming, completed, failed]
    FinishReason:
      type: string
      enum: [stop, length, refusal, error]
    ErrorDetail:
      type: object
      required: [code, message, retryable, request_id, stage]
      properties:
        code:
          type: string
        message:
          type: string
          description: User-safe localized message; never includes provider credentials or internal endpoint details.
        retryable:
          type: boolean
        request_id:
          type: string
        stage:
          type: string
          description: Stable product stage, for example runtime_call or runtime_response_validation.
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    AuthRole:
      type: string
      enum: [user, knowledge_admin, system_admin, admin]
      description: "`admin` is a legacy session role treated as `system_admin`; new sessions use `system_admin`."
    AuthenticatedUser:
      type: object
      required: [user_id, username, role]
      properties:
        user_id: {type: string}
        username: {type: string}
        role: {$ref: "#/components/schemas/AuthRole"}
      additionalProperties: false
    LoginResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: "#/components/schemas/AuthenticatedUser"}
      additionalProperties: false
    Pagination:
      type: object
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
      additionalProperties: false
    Conversation:
      type: object
      required:
        - conversation_id
        - owner_id
        - title
        - created_at
        - updated_at
        - config_version
        - retrieval_config_version
        - model_id
      properties:
        conversation_id:
          type: string
        owner_id:
          type: string
          description: Stable authenticated subject that owns this conversation.
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        config_version:
          type: string
        retrieval_config_version:
          type: string
        knowledge_snapshot_id:
          type: string
          deprecated: true
          description: Legacy conversation field. K5 records the actual knowledge snapshot on each assistant message instead.
        model_id:
          type: string
      additionalProperties: false
    ConversationEnvelope:
      type: object
      required: [conversation]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
      additionalProperties: false
    ConversationListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
      additionalProperties: false
    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
      additionalProperties: false
    UpdateConversationTitleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 48
      additionalProperties: false
    Message:
      type: object
      required:
        - message_id
        - conversation_id
        - role
        - content
        - status
        - created_at
        - knowledge_used
      properties:
        message_id:
          type: string
        conversation_id:
          type: string
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        status:
          $ref: "#/components/schemas/MessageStatus"
        created_at:
          type: string
          format: date-time
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        citations_count:
          type: integer
          minimum: 0
        knowledge_snapshot_id:
          type: string
        knowledge_snapshot_manifest_hash:
          type: string
        answered_at:
          type: string
          format: date-time
        freshness_status:
          $ref: "#/components/schemas/FreshnessStatus"
        citation_anchors:
          type: array
          items:
            $ref: "#/components/schemas/CitationAnchor"
        intent:
          type: string
          enum: [knowledge_query, social_greeting, social_thanks, social_farewell, capability_help, off_topic, out_of_scope]
        knowledge_used:
          type: boolean
        answer_disposition:
          $ref: "#/components/schemas/AnswerDisposition"
        answer_policy_version:
          type: string
          enum: [answer_policy_v1, answer_policy_v2, answer_policy_v3, answer_policy_v4, answer_policy_v5]
        policy_evaluation_performed:
          type: boolean
        answer_generation_performed:
          type: boolean
        clarification_id:
          type: string
        coverage:
          $ref: "#/components/schemas/AnswerCoverage"
      additionalProperties: false
    AnswerDisposition:
      type: string
      enum: [grounded_answer, partial_answer, clarification_required, insufficient_evidence, controlled_response]
    AnswerCoverage:
      type: object
      required: [requested_count, supported_count, uncovered_description]
      properties:
        requested_count:
          type: integer
          minimum: 1
        supported_count:
          type: integer
          minimum: 0
        uncovered_description:
          type: string
          minLength: 1
          maxLength: 1200
      additionalProperties: false
    AnswerClarification:
      type: object
      required: [missing_dimensions, question]
      properties:
        missing_dimensions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        question:
          type: string
          minLength: 1
          maxLength: 600
      additionalProperties: false
    ClarificationResolution:
      type: object
      required: [pending_clarification_id, pending_state_version, action]
      properties:
        pending_clarification_id:
          type: string
        pending_state_version:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [resolved, abandoned, needs_more]
        resolved_query:
          type: string
          minLength: 1
          maxLength: 600
      additionalProperties: false
    RetrievalCandidate:
      type: object
      required: [chunk_id, file_id, document_id, revision_id, chunk_content_sha256, knowledge_snapshot_id, rank, score, source_locator]
      properties:
        chunk_id:
          type: string
        file_id:
          type: string
        document_id:
          type: string
        revision_id:
          type: string
        chunk_content_sha256:
          type: string
        knowledge_snapshot_id:
          type: string
        rank:
          type: integer
          minimum: 1
        score:
          type: number
        source_locator:
          $ref: "#/components/schemas/SourceLocator"
      additionalProperties: false
    ConversationDetailResponse:
      type: object
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      additionalProperties: false
    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        stream:
          type: boolean
          default: true
      additionalProperties: false
    MessageExchangeResponse:
      type: object
      required: [user_message, assistant_message]
      properties:
        user_message:
          $ref: "#/components/schemas/Message"
        assistant_message:
          $ref: "#/components/schemas/Message"
      additionalProperties: false
    SourceLocator:
      type: object
      required: [source_format]
      properties:
        source_format:
          $ref: "#/components/schemas/SourceFormat"
        page_no:
          type: integer
          minimum: 1
        heading_path:
          type: array
          items:
            type: string
        paragraph_index:
          type: integer
          minimum: 0
        sheet_name:
          type: string
        cell_range:
          type: string
        slide_no:
          type: integer
          minimum: 1
        slide_title:
          type: string
        block_label:
          type: string
        json_path:
          type: string
      additionalProperties: false
    Citation:
      type: object
      required:
        - message_id
        - chunk_id
        - file_id
        - filename
        - rank
        - score
        - citation_label
        - source_locator
        - snippet
      properties:
        message_id:
          type: string
        chunk_id:
          type: string
        file_id:
          type: string
        document_id:
          type: string
        revision_id:
          type: string
        chunk_content_sha256:
          type: string
        knowledge_snapshot_id:
          type: string
        filename:
          type: string
        rank:
          type: integer
          minimum: 1
        score:
          type: number
        citation_label:
          type: string
        source_locator:
          $ref: "#/components/schemas/SourceLocator"
        snippet:
          type: string
      additionalProperties: false
    CitationAnchor:
      type: object
      required: [start_rune, end_rune, citation_ranks]
      properties:
        start_rune:
          type: integer
          minimum: 0
        end_rune:
          type: integer
          minimum: 1
        citation_ranks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      additionalProperties: false
    MessageSourcesResponse:
      type: object
      required: [message_id, items]
      properties:
        message_id:
          type: string
        knowledge_snapshot_id:
          type: string
        knowledge_snapshot_manifest_hash:
          type: string
        freshness_status:
          $ref: "#/components/schemas/FreshnessStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
      additionalProperties: false
    FreshnessStatus:
      type: string
      enum: [current, possibly_stale, revalidated, unknown]
    RevalidateMessageRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      additionalProperties: false
    RevalidationRun:
      type: object
      required: [revalidation_id, conversation_id, original_message_id, status, trigger, latest_snapshot_id, latest_snapshot_manifest_hash, related_update_event_ids, requested_at]
      properties:
        revalidation_id:
          type: string
        conversation_id:
          type: string
        original_message_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        trigger:
          type: string
          enum: [manual]
        reason:
          type: string
        latest_snapshot_id:
          type: string
        latest_snapshot_manifest_hash:
          type: string
        related_update_event_ids:
          type: array
          items:
            type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        outcome:
          $ref: "#/components/schemas/RevalidationOutcome"
        result:
          $ref: "#/components/schemas/RevalidationResult"
        error:
          $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false
    RevalidationOutcome:
      type: string
      enum: [still_valid, needs_update, insufficient_evidence]
    RevalidationResult:
      type: object
      required: [revalidation_id, content, knowledge_snapshot_id, knowledge_snapshot_manifest_hash, outcome, citations, completed_at]
      properties:
        revalidation_id:
          type: string
        content:
          type: string
        knowledge_snapshot_id:
          type: string
        knowledge_snapshot_manifest_hash:
          type: string
        outcome:
          $ref: "#/components/schemas/RevalidationOutcome"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        completed_at:
          type: string
          format: date-time
      additionalProperties: false
    RevalidationRunEnvelope:
      type: object
      required: [revalidation]
      properties:
        revalidation:
          $ref: "#/components/schemas/RevalidationRun"
      additionalProperties: false
    KnowledgeFile:
      type: object
      required:
        - file_id
        - filename
        - mime_type
        - source_format
        - status
        - uploaded_by
        - uploaded_at
        - object_uri
        - parse_version
        - index_version
      properties:
        file_id:
          type: string
        filename:
          type: string
        mime_type:
          type: string
